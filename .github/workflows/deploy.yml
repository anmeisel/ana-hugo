name: Deploy to Alwaysdata

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"

      - name: Build Hugo site
        run: hugo --minify

      - name: Deploy via SFTP with lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -c "set sftp:auto-confirm yes; open -u ${{ secrets.ALWAYSDATA_USERNAME }},${{ secrets.ALWAYSDATA_PASSWORD }} sftp://${{ secrets.ALWAYSDATA_SERVER }}:22; mirror -R ./public/ /home/ana/www/ --verbose --delete --parallel=4"
