name: Deploy to Alwaysdata

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"

      - name: Build Hugo site
        run: hugo --minify

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: public/
          remote_path: /home/ana/www/
          remote_host: ssh-ana.alwaysdata.net
          remote_user: ana
          remote_key: ${{ secrets.ALWAYSDATA_SSH_KEY }}